spring:
  application:
    name: zhuatech-erp
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhuatech_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:zhuatech}
    password: ${DB_PASSWORD:zhuatech_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET:change-this-zhuatech-erp-secret-at-least-32-bytes}
    expiration: PT24H
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
zhuatech:
  ai:
    provider: ${ZHUATECH_AI_PROVIDER:local}
    base-url: ${ZHUATECH_AI_BASE_URL:https://api.deepseek.com}
    model: ${ZHUATECH_AI_MODEL:deepseek-chat}
    api-key: ${ZHUATECH_AI_API_KEY:}
